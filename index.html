<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>AI Generator</title>
</head>
<body>
    <button id="generate">Generate</button>

    <script>
        document.getElementById("generate").onclick = async () => {
            await fetch("/api/generate", {
                method: "POST"
            });
        };
    </script>
</body>
</html>
